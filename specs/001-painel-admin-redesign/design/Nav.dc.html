<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Navegação principal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header style="background: #F6F5F2; border-bottom: 1px solid #E3E1DC; font-family: Inter, system-ui, sans-serif; color: #111114">
  <div style="max-width: 1200px; margin: 0 auto; padding: 12px clamp(16px, 4vw, 40px); display: flex; align-items: center; gap: clamp(12px, 3vw, 40px)">
    <a href="Main.dc.html" aria-label="Juventude SALT, página inicial" style="flex: 0 0 auto; display: flex; align-items: center; min-height: 44px">
      <img src="/_blob/da82e60b4142e92541242f6e0c9f53c3" alt="SALT" style="height: 22px; width: auto; display: block">
    </a>
    <nav aria-label="Principal" style="flex: 1 1 auto; min-width: 0; overflow-x: auto; display: flex">
      <ul style="list-style: none; margin: 0 auto; padding: 0; display: flex; gap: 2px">
        <sc-for list="{{links}}" as="l" hint-placeholder-count="6">
          <li style="flex: 0 0 auto">
            <sc-if value="{{l.active}}" hint-placeholder-val="{{false}}">
              <a href="{{l.href}}" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E3E1DC; color: #111114; font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap">{{l.label}}</a>
            </sc-if>
            <sc-if value="{{l.idle}}" hint-placeholder-val="{{true}}">
              <a href="{{l.href}}" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: #4A4A52; font-size: 15px; font-weight: 500; text-decoration: none; white-space: nowrap">{{l.label}}</a>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </nav>
    <a href="https://wa.me/553192919718" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #111114; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap">
      Fale conosco
    </a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","sobre","eventos","devocional","podcast","contribua","nenhum"],"default":"inicio"},"$preview":{"width":1440,"height":69}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'inicio';
    const items = [
      { id: 'inicio', label: 'Início', href: 'Main.dc.html' },
      { id: 'sobre', label: 'Sobre', href: 'Sobre.dc.html' },
      { id: 'eventos', label: 'Eventos', href: 'Eventos.dc.html' },
      { id: 'devocional', label: 'Devocional', href: 'Devocional.dc.html' },
      { id: 'podcast', label: 'Podcast', href: 'Podcast.dc.html' },
      { id: 'contribua', label: 'Contribua', href: 'Contribua.dc.html' }
    ];
    return {
      links: items.map((l) => ({ ...l, active: l.id === active, idle: l.id !== active }))
    };
  }
}
</script>
</body>
</html>
