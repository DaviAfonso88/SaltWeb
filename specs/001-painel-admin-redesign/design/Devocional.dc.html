<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Juventude SALT — Devocionais</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111114}
a{color:#92348C}a:hover{color:#7A2B74}
input::placeholder{color:#8A8A92}
</style>
</helmet>
<div style="background: #F6F5F2; color: #111114; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.6">
  <dc-import name="Nav" active="devocional" hint-size="100%,69px"></dc-import>

  <main>
    <!-- Cabeçalho -->
    <section aria-labelledby="page-title" style="padding: clamp(48px, 7vw, 96px) 0 clamp(40px, 5vw, 56px)">
      <div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 64px">
        <div style="flex: 1 1 520px; min-width: 0">
          <p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #92348C">Devocional</p>
          <h1 id="page-title" style="margin: 20px 0 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 600; font-size: clamp(44px, 6.4vw, 88px); line-height: 0.98; letter-spacing: -0.045em">Devocionais</h1>
        </div>
        <p style="flex: 1 1 320px; max-width: 400px; margin: 0; font-size: 18px; color: #4A4A52">Inspiração diária para sua caminhada com Deus.</p>
      </div>
    </section>

    <!-- Mais recente -->
    <section aria-label="Devocional mais recente">
      <div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px)">
        <a href="{{latest.href}}" style="background: #111114; color: #F6F5F2; border-radius: 24px; padding: clamp(24px, 4vw, 44px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px 48px; text-decoration: none">
          <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
            <p style="margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #D9A6D4">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>Mais recente · {{latest.mesNome}}
            </p>
            <p style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-size: clamp(28px, 3.6vw, 44px); font-weight: 600; line-height: 1.08; letter-spacing: -0.03em">{{latest.t}}</p>
          </div>
          <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #FFFFFF; color: #111114; font-size: 15px; font-weight: 600">Ler agora
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
          </span>
        </a>
      </div>
    </section>

    <!-- Lista -->
    <section aria-labelledby="lista-title" style="padding: clamp(48px, 6vw, 72px) 0 clamp(72px, 9vw, 128px)">
      <div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px)">
        <h2 id="lista-title" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Todos os devocionais</h2>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; margin-bottom: 28px">
          <div style="flex: 1 1 320px; max-width: 420px; position: relative">
            <label for="busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pesquisar por título</label>
            <span style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #6A6A72; display: flex">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            </span>
            <input id="busca" type="search" placeholder="Pesquisar por título..." value="{{query}}" onChange="{{onSearch}}" style="width: 100%; height: 48px; padding: 0 16px 0 46px; border-radius: 999px; border: 1px solid #D6D3CC; background: #FFFFFF; font: inherit; font-size: 15px; color: #111114; box-sizing: border-box">
          </div>
          <div role="group" aria-label="Filtrar por mês" style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{meses}}" as="m" hint-placeholder-count="7">
              <sc-if value="{{m.selected}}" hint-placeholder-val="{{false}}">
                <button type="button" aria-pressed="true" onClick="{{m.pick}}" style="min-height: 40px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: #111114; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{m.label}}</button>
              </sc-if>
              <sc-if value="{{m.idle}}" hint-placeholder-val="{{true}}">
                <button type="button" aria-pressed="false" onClick="{{m.pick}}" style="min-height: 40px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D6D3CC; color: #111114; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{m.label}}</button>
              </sc-if>
            </sc-for>
          </div>
        </div>
        <p style="margin: 0 0 20px; font-size: 14px; color: #6A6A72">{{countLabel}}</p>

        <sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">
          <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px">
            <sc-for list="{{lista}}" as="d" hint-placeholder-count="12">
              <li style="display: flex">
                <a href="{{d.href}}" style="flex: 1 1 auto; background: #FFFFFF; border: 1px solid #E3E1DC; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px; color: #111114; text-decoration: none; min-height: 180px; box-sizing: border-box">
                  <span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #F3E9F2; color: #7A2B74; font-size: 12px; font-weight: 600; letter-spacing: 0.04em">{{d.mesNome}}</span>
                  <span style="font-family: 'Inter Tight', Inter, sans-serif; font-size: 20px; font-weight: 600; line-height: 1.25; letter-spacing: -0.015em">{{d.t}}</span>
                  <span style="margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #4A4A52">Ler devocional
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
                  </span>
                </a>
              </li>
            </sc-for>
          </ul>
        </sc-if>
        <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
          <div style="border: 1px dashed #CFCCC5; border-radius: 20px; padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: #4A4A52">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <p style="margin: 0; font-weight: 600; color: #111114">Nenhum devocional encontrado</p>
            <p style="margin: 0; font-size: 15px">Tente outro termo ou limpe os filtros.</p>
            <button type="button" onClick="{{clear}}" style="margin-top: 4px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; box-shadow: inset 0 0 0 1px #CFCCC5; background: #FFFFFF; color: #111114; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Limpar filtros</button>
          </div>
        </sc-if>
      </div>
    </section>
  </main>

  <dc-import name="Footer" hint-size="100%,460px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mes: 'TODOS', query: '' };
  }
  renderVals() {
    const nomes = { JAN: 'Janeiro', FEV: 'Fevereiro', MAR: 'Março', ABR: 'Abril', MAI: 'Maio', JUN: 'Junho' };
    const curtos = { TODOS: 'Todos', JAN: 'Jan', FEV: 'Fev', MAR: 'Mar', ABR: 'Abr', MAI: 'Mai', JUN: 'Jun' };
    const data = [
      { t: 'Desconectados e Desviados', m: 'JUN', href: 'https://drive.google.com/file/d/1323PE8r4cbqnfodcg4oaeN_Lrc1ie_D1/view?usp=drive_link' },
      { t: 'Desconectados - Amigo do Mundo, Inimigo de Deus', m: 'JUN', href: 'https://drive.google.com/file/d/1w7tQRU_thiMpZ8_jCJbQNjUeE34sGmtt/view?usp=drive_link' },
      { t: 'Desconectados - O Amor Não Tropeça', m: 'JUN', href: 'https://drive.google.com/file/d/17gYG41-Y9ie7hW7o83UfAgCla1wzB0-A/view?usp=drive_link' },
      { t: 'Desconectados - O Pai das Luzes', m: 'JUN', href: 'https://drive.google.com/file/d/1wK7Rh0nylmFpsAeFS164GPe8It1VYdid/view?usp=drive_link' },
      { t: 'Casa Aberta: Lavando Roupa Suja', m: 'MAI', href: 'https://drive.google.com/file/d/1eCQKIezi0jX2wToxRG6iUiEmkaTlUNRv/view?usp=drive_link' },
      { t: 'Casa Aberta: Tem um Monstro no Meu Quarto', m: 'MAI', href: 'https://drive.google.com/file/d/1r5uiJTE4T1avBDBxw7eF6i7-_lgiqK10/view?usp=drive_link' },
      { t: 'Casa Aberta: O Elefante na Sala', m: 'MAI', href: 'https://drive.google.com/file/d/1w_yS1nuQzyFbQLGLd6P6NQlIvNdv6gQh/view?usp=drive_link' },
      { t: 'Somos Peregrinos', m: 'ABR', href: 'https://drive.google.com/file/d/1sCTgJyn0u1pqqPQzAEHjp-b0ddqexOBo/view?usp=drive_link' },
      { t: 'Minha Vida Dupla! Parte 2', m: 'ABR', href: 'https://drive.google.com/file/d/1eMnlZ6WAL4bHN2rZfFwC5BTqHE_rWqEL/view?usp=drive_link' },
      { t: 'Minha Vida Dupla!', m: 'ABR', href: 'https://drive.google.com/file/d/1lK2NNZ3RavGDoCkrLdF6eoIBVaD8KfXf/view?usp=drive_link' },
      { t: 'Tudo ou Nada - Jesus Ressucitou', m: 'ABR', href: 'https://drive.google.com/file/d/1ZvG09OIxaporaWd49qJMlKrgk00itFda/view?usp=drive_link' },
      { t: 'Crises de Fé', m: 'ABR', href: 'https://drive.google.com/file/d/1wmdxX0wRRKgB2a2FCXjyk6ZGjYPQglHT/view?usp=sharing' },
      { t: 'O Sarau de Deus', m: 'MAR', href: 'https://drive.google.com/file/d/1xAbz-QRvEvxkJNpwGVWrB4sP435TqYoL/view?usp=sharing' },
      { t: 'Nós Não Somos Deuses', m: 'MAR', href: 'https://drive.google.com/file/d/17zd8xa4jqy1hNbR3y9hC-XqfIlF6HOnL/view?usp=drivesdk' },
      { t: 'Deus Não é Religião', m: 'MAR', href: 'https://drive.google.com/file/d/1gQY8KBb-vEEkvB8HldIVRnZOaiGPshjH/view?usp=drivesdk' },
      { t: 'Somos Um', m: 'MAR', href: 'https://drive.google.com/file/d/1Ia0OAfV661l0t3ITDAlOBKExgafySqSN/view?usp=drive_link' },
      { t: 'Como Receber a Boa Notícia', m: 'FEV', href: 'https://drive.google.com/file/d/18mh86KQeTDJ-YZuH4_RMJRS1Quo0k9B-/view?usp=sharing' },
      { t: 'O Plano de Deus Para a Sua Vida', m: 'FEV', href: 'https://drive.google.com/file/d/1Lw-ccs5HB3ApsN6rSUJNXQquElvZZEgd/view?usp=drive_link' },
      { t: 'A Solução de Deus Para o Maior Problema da Vida', m: 'FEV', href: 'https://drive.google.com/file/d/1_7NrpsSnMWcwq4EaX5H5e97Yjw4AyU-W/view?usp=drive_link' },
      { t: 'Deus se Importa com Você', m: 'FEV', href: 'https://drive.google.com/file/d/15oGgJ1gMD1HBVvtgqf62FfGCASt-8gqm/view?usp=drivesdk' },
      { t: 'Chamados a viver a Igreja', m: 'JAN', href: 'https://drive.google.com/file/d/1muL3DspnLqSloReHvTAYwJVL_iAKV1wm/view?usp=sharing' },
      { t: 'Amar a Deus, servir a Igreja e discipular pessoas.', m: 'JAN', href: 'https://drive.google.com/file/d/1jt6rBVtKHwo5-2XP8gauKvvpAGF1dg-P/view?usp=drivesdk' },
      { t: 'Tá amarrado!', m: 'JAN', href: 'https://drive.google.com/file/d/1yVs5tgfWzrnqDSBG3DRb5hdX5PgfRbsq/view?usp=sharing' },
      { t: 'Você sabe orar?', m: 'JAN', href: 'https://drive.google.com/file/d/1X3oqN3iSj6v7-azr3iHvFcCy9URrC7D6/view?usp=sharing' }
    ].map((d) => ({ ...d, mesNome: nomes[d.m] }));

    const mes = this.state.mes;
    const query = this.state.query || '';
    const q = query.trim().toLowerCase();
    let lista = data
      .filter((d) => mes === 'TODOS' || d.m === mes)
      .filter((d) => !q || d.t.toLowerCase().includes(q));
    if (mes === 'TODOS' && !q) lista = lista.slice(1);
    const total = mes === 'TODOS' && !q ? data.length : lista.length;

    return {
      latest: data[0],
      query: query,
      onSearch: (e) => this.setState({ query: e && e.target ? e.target.value : '' }),
      clear: () => this.setState({ mes: 'TODOS', query: '' }),
      meses: ['TODOS', 'JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN'].map((k) => ({
        label: curtos[k],
        selected: k === mes,
        idle: k !== mes,
        pick: () => this.setState({ mes: k })
      })),
      lista: lista,
      hasResults: lista.length > 0,
      noResults: lista.length === 0,
      countLabel: total === 1 ? '1 devocional' : total + ' devocionais'
    };
  }
}
</script>
</body>
</html>
